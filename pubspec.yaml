name: fupan_shouji
description: 复盘手记——本地优先的个人 A 股交易手账（iOS / 鸿蒙 / 安卓）。
publish_to: 'none'
version: 0.1.0

environment:
  # 主 SDK 为鸿蒙移植版 Flutter 3.22.1-ohos（Dart 3.4），版本上界需兼容
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_riverpod: ^2.5.1
  fl_chart: ^0.68.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true
