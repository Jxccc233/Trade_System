name: fupan_shouji
description: 复盘手记——本地优先的个人 A 股交易手账（iOS / 鸿蒙 / 安卓）。
publish_to: 'none'
version: 0.1.0

environment:
  # 主 SDK 为鸿蒙移植版 Flutter 3.22.1-ohos（Dart 3.4），版本上界需兼容
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.20.0
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_riverpod: ^2.5.1
  fl_chart: ^0.68.0
  intl: ^0.19.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.20.0

# 鸿蒙适配：path_provider 使用 OpenHarmony-SIG 官方适配版（含 ohos 实现）
# 主包 + ohos 端实现包都要引入，flutter 工具才能注册鸿蒙插件
dependency_overrides:
  path_provider:
    git:
      url: "https://gitee.com/openharmony-sig/flutter_packages.git"
      path: "packages/path_provider/path_provider"
      ref: br_path_provider-v2.1.4_ohos
  path_provider_ohos:
    git:
      url: "https://gitee.com/openharmony-sig/flutter_packages.git"
      path: "packages/path_provider/path_provider_ohos"
      ref: br_path_provider-v2.1.4_ohos
  # image_picker_ohos 从 gitee 拉取极慢，改为本地副本（来源：br_image_picker-v1.1.2_ohos 分支）
  image_picker_ohos:
    path: third_party/image_picker_ohos

flutter:
  uses-material-design: true
